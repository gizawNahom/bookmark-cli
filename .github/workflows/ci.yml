name: CI

# Commit stage (feature-delta.md DEVOPS wave, "[REF] CI/CD Pipeline Outline" -- "PR / commit
# stage" row). Trunk-based branching (below): every PR into main and every push to main runs
# the full commit stage, since main must always stay releasable.
#
# Parallel jobs per concern, no `needs` between them (Core Principle 4 / feature-delta.md's own
# "Rejected simpler alternative" -- a single serial job would blow past the <10 minute
# commit-stage target once the fault-injection suite is added on top; that suite lives in its
# own workflow file, fault-injection.yml, for the same reason).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: go build ./...
        run: go build ./...

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      # This project's test strategy (DISTILL "Architecture of Reference") drives 100% real
      # adapters through the compiled `bm` binary as a subprocess -- there are no in-process unit
      # tests, so plain `go test -coverprofile` can't see any of internal/*'s execution (it only
      # instruments code that runs inside the test binary itself, not a spawned child process).
      # GOCOVERDIR makes tests/acceptance/bookmark_cli/harness_test.go's TestMain build bm as a
      # coverage-instrumented binary; each subprocess invocation flushes counters here on exit.
      # See go.dev/blog/integration-test-coverage.
      - name: Prepare coverage counter dir
        run: mkdir -p "${{ runner.temp }}/covdata"
      - name: go test ./... (full suite; subprocess bm invocations instrumented via GOCOVERDIR)
        env:
          GOCOVERDIR: ${{ runner.temp }}/covdata
        run: go test ./...
      - name: Convert subprocess coverage counters to a cover profile
        run: go tool covdata textfmt -i="${{ runner.temp }}/covdata" -o=coverage.out
      # Quality gate: >= 80% coverage, per production-readiness default (feature-delta.md CI/CD
      # Pipeline Outline table). Threshold is the project default, not invented here -- see
      # nw-production-readiness skill, "Quality Gates for Production Readiness".
      - name: Coverage gate (>= 80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "${COVERAGE} < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint (golangci-lint, incl. staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      # Built from source (not golangci-lint-action's precompiled binary) so the linter's own
      # type-checker always uses the same Go toolchain setup-go just installed for this module --
      # a precompiled binary built with an older Go release cannot parse newer go.mod-declared
      # language versions (see git history for the go1.24-vs-go1.25 failure this replaced).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: golangci-lint run
        run: golangci-lint run

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required by github/codeql-action/upload-sarif
      actions: read # required by upload-sarif's SARIF fingerprinting step (workflow-runs lookup)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: "-fmt=sarif -out=gosec-results.sarif ./..."
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  sca:
    name: SCA (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arch-lint:
    name: Package boundary (go-arch-lint, ADR-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest
      - name: go-arch-lint check
        run: go-arch-lint check

  probe-presence-check:
    name: Structural probe-presence check (AST, ADR-007 layer 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      # ADR-007 layer 2: a go/ast-based script asserting every type implementing a driven-adapter
      # interface (ports.BookmarkReader/BookmarkWriter/BackupService/UsageLogger) also defines
      # `Probe() error`. This CI job wires up the contract described in ADR-007 and
      # feature-delta.md's CI/CD Pipeline Outline table; the script itself
      # (tools/probecheck/main.go) is DELIVER-wave implementation scope (software-crafter), not
      # authored here -- CI/CD authoring only wires the invocation point so the gate exists from
      # day one and starts passing the moment the script lands, rather than being retrofitted
      # later.
      - name: Run structural probe-presence check
        run: go run ./tools/probecheck ./...
